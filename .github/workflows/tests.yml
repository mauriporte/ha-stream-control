name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pytest
      - run: python -m pytest tests
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t stream-control .
      - run: docker run --rm stream-control sh -c "go2rtc -version && ffmpeg -version | head -1 && adb version | head -1 && ls -l /opt/scrcpy/scrcpy-server.jar && python3 -m py_compile /opt/stream.py /opt/master.py"
