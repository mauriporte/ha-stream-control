# Home Assistant configuration for Stream Control. Merge these blocks into configuration.yaml
# (add the entries to your existing switch:/automation: lists if you already have them).
# Replace 192.168.1.20 with the host running the container, and the device IPs with yours.
# secrets.yaml must contain:  stream_control_token: <the same value as ADB_CONTROL_TOKEN in the container>

switch:
  # Main switch: starts or stops go2rtc. Off = nothing streams.
  - platform: rest
    name: Stream Control
    unique_id: stream_control_master
    icon: mdi:cast-audio
    resource: http://192.168.1.20:8005/master
    method: post
    body_on: '{"on": true}'
    body_off: '{"on": false}'
    is_on_template: "{{ value_json.is_on }}"
    headers:
      X-Token: !secret stream_control_token
      Content-Type: application/json
    timeout: 30

  # Per device (repeat for each one, changing name, unique_id and ip). Two groups; turning one switch on turns the
  # others of its group off. Pantalla/Cámara frontal/Cámara trasera: what is streamed (all off = left out of the viewer).
  # Sonido/Micrófono: what is heard (both off = silence, applied live). Changing the source restarts the stream.
  # The names give the entity IDs used below (switch.stream_phone_a_video, _camera, _camera_back, _audio, _mic);
  # the dashboard shows them as Pantalla, Cámara frontal, Cámara trasera, Sonido and Micrófono.
  - platform: rest
    name: Stream Phone A video
    unique_id: stream_phone_a_video
    icon: mdi:monitor-cellphone
    resource: http://192.168.1.20:8005/screen
    state_resource: http://192.168.1.20:8005/screen?ip=192.168.1.21
    method: post
    body_on: '{"ip": "192.168.1.21", "on": true}'
    body_off: '{"ip": "192.168.1.21", "on": false}'
    is_on_template: "{{ value_json.is_on }}"
    headers:
      X-Token: !secret stream_control_token
      Content-Type: application/json
  # the front camera (Android 12+); the Horizontal switch sets the cameras' shape too
  - platform: rest
    name: Stream Phone A camera
    unique_id: stream_phone_a_camera
    icon: mdi:webcam
    resource: http://192.168.1.20:8005/camera
    state_resource: http://192.168.1.20:8005/camera?ip=192.168.1.21
    method: post
    body_on: '{"ip": "192.168.1.21", "on": true}'
    body_off: '{"ip": "192.168.1.21", "on": false}'
    is_on_template: "{{ value_json.is_on }}"
    headers:
      X-Token: !secret stream_control_token
      Content-Type: application/json
  - platform: rest
    name: Stream Phone A audio
    unique_id: stream_phone_a_audio
    icon: mdi:volume-high
    resource: http://192.168.1.20:8005/sound
    state_resource: http://192.168.1.20:8005/sound?ip=192.168.1.21
    method: post
    body_on: '{"ip": "192.168.1.21", "on": true}'
    body_off: '{"ip": "192.168.1.21", "on": false}'
    is_on_template: "{{ value_json.is_on }}"
    headers:
      X-Token: !secret stream_control_token
      Content-Type: application/json
  # the rear camera
  - platform: rest
    name: Stream Phone A camera back
    unique_id: stream_phone_a_camera_back
    icon: mdi:camera-rear
    resource: http://192.168.1.20:8005/camera_back
    state_resource: http://192.168.1.20:8005/camera_back?ip=192.168.1.21
    method: post
    body_on: '{"ip": "192.168.1.21", "on": true}'
    body_off: '{"ip": "192.168.1.21", "on": false}'
    is_on_template: "{{ value_json.is_on }}"
    headers:
      X-Token: !secret stream_control_token
      Content-Type: application/json
  # Android 11+
  - platform: rest
    name: Stream Phone A mic
    unique_id: stream_phone_a_mic
    icon: mdi:microphone
    resource: http://192.168.1.20:8005/mic
    state_resource: http://192.168.1.20:8005/mic?ip=192.168.1.21
    method: post
    body_on: '{"ip": "192.168.1.21", "on": true}'
    body_off: '{"ip": "192.168.1.21", "on": false}'
    is_on_template: "{{ value_json.is_on }}"
    headers:
      X-Token: !secret stream_control_token
      Content-Type: application/json

automation:
  # The groups are exclusive in the container; refresh the device's other switches at once (REST switches poll slowly)
  - alias: "Stream: refresh the switch pairs"
    mode: queued
    triggers:
      - trigger: state
        entity_id: [switch.stream_phone_a_video, switch.stream_phone_a_camera, switch.stream_phone_a_camera_back,
                    switch.stream_phone_a_audio, switch.stream_phone_a_mic]
        to: "on"
    actions:
      - delay: { seconds: 1 }
      - action: homeassistant.update_entity
        target:
          entity_id: >-
            {% set dev = trigger.entity_id | regex_replace('_(video|camera_back|camera|audio|mic)$', '') %}
            {{ states.switch | map(attribute='entity_id') | select('match', dev ~ '_(video|camera_back|camera|audio|mic)$') | list }}
  # Optional, with ADB Control: when Stream Control is turned off it releases the devices; hand them back to
  # ADB Control (rest_command.adb_connect is in ADB Control's own example configuration).
  - alias: "Stream Control off: devices back to ADB Control"
    triggers:
      - trigger: state
        entity_id: switch.stream_control
        from: "on"
        to: "off"
    actions:
      - repeat:
          for_each: ["192.168.1.21", "192.168.1.23"]
          sequence:
            - action: rest_command.adb_connect
              data:
                ip: "{{ repeat.item }}"
              continue_on_error: true
      - delay: { seconds: 3 }
      - action: homeassistant.update_entity
        target:
          entity_id: [sensor.adb_dispositivos_conectados, switch.adb_control]

# Optional, for watching from outside your home network: a camera per device.
# Settings → Devices & services → Add integration → Generic Camera:
#   Stream source:  rtsp://stream:<password>@192.168.1.20:8554/phone_a
#   RTSP transport: TCP,  Authentication: basic
# Home Assistant then serves it over WebRTC (Opus audio) on the LAN and over HLS (AAC audio) from outside.
